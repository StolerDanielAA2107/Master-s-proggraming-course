<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Редактировать {{ emp_type }}</h1>
        <form method="POST" class="card p-4">
            <div class="mb-3">
                <label class="form-label">Имя:</label>
                <input type="text" name="name" value="{{ emp.name }}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Возраст:</label>
                <input type="number" name="age" value="{{ emp.age }}" class="form-control">
            </div>
            {% if emp_type == 'Manager' %}
                <div class="mb-3">
                    <label class="form-label">Отдел:</label>
                    <input type="text" name="department" value="{{ emp.department }}" class="form-control">
                </div>
            {% elif emp_type == 'Director' %}
                <div class="mb-3">
                    <label class="form-label">Должность:</label>
                    <input type="text" name="title" value="{{ emp.title }}" class="form-control">
                </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
        <a href="{{ url_for('employee_list') }}" class="btn btn-secondary mt-3">Назад</a>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
